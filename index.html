<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Pro Max</title>
  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:15px;color:#333}
.dark{background:linear-gradient(135deg,#1a1a2e,#16213e)}
.box{background:#fff;border-radius:18px;padding:22px;max-width:500px;margin:20px auto;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.dark .box{background:#1f2937;color:#e5e7eb}
h1{font-size:20px;text-align:center;margin-bottom:15px}
h1 span{font-size:14px;display:block;color:#888;font-weight:400;margin-top:3px}
.tab-row{display:flex;gap:5px;background:#f0f0f0;padding:4px;border-radius:10px;margin-bottom:15px}
.dark .tab-row{background:#374151}
.tab-btn{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;color:#888}
.tab-btn.on{background:#667eea;color:#fff}
input,select,button{width:100%;padding:11px 13px;border-radius:9px;border:2px solid #e0e0e0;font-size:14px;margin-bottom:9px;outline:none;background:#fff}
.dark input,.dark select{background:#374151;border-color:#4b5563;color:#e5e7eb}
input:focus,select:focus{border-color:#667eea}
button{background:#667eea;color:#fff;border:none;cursor:pointer;font-weight:600}
button:hover{background:#5568d3}
.card{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:13px;text-align:center;margin-bottom:13px}
.card h2{font-size:26px;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.sum{padding:14px;border-radius:10px;text-align:center;font-size:12px}
.in{background:#e8f5e9;color:#2e7d32}
.ex{background:#ffebee;color:#c62828}
.dark .in{background:#064e3b;color:#6ee7b7}
.dark .ex{background:#7f1d1d;color:#fca5a5}
.sum h3{font-size:16px;margin-top:4px}
.chart-box{background:#f9f9f9;border-radius:11px;padding:13px;margin-bottom:13px;height:240px;position:relative}
.dark .chart-box{background:#374151}
.chart-title{font-size:13px;font-weight:600;margin-bottom:8px;color:#555}
.dark .chart-title{color:#e5e7eb}
.item{background:#f9f9f9;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid}
.dark .item{background:#374151}
.item.inc{border-color:#10b981}
.item.exp{border-color:#ef4444}
.item h4{font-size:13px;margin-bottom:2px}
.item small{color:#888;font-size:11px}
.tag{font-size:10px;background:#667eea;color:#fff;padding:2px 6px;border-radius:5px;margin-left:5px}
.amt{font-weight:700;font-size:13px}
.inc .amt{color:#10b981}
.exp .amt{color:#ef4444}
.del{background:#ef4444;color:#fff;border:none;padding:5px 7px;border-radius:6px;font-size:11px;margin-left:6px;width:auto;cursor:pointer}
.empty{text-align:center;color:#999;padding:25px;font-style:italic;font-size:13px}
.bar{height:7px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:7px}
.dark .bar{background:#4b5563}
.fill{height:100%;border-radius:4px;transition:.5s}
.ok{background:#10b981}.warn{background:#f59e0b}.danger{background:#ef4444}
.budget-item,.goal-item{background:#f9f9f9;border-radius:11px;padding:14px;margin-bottom:11px}
.dark .budget-item,.dark .goal-item{background:#374151}
.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;align-items:center;flex-wrap:wrap;gap:4px}
.insight{color:#fff;padding:15px;border-radius:11px;margin-bottom:11px}
.insight h4{font-size:14px;margin-bottom:6px}
.insight p{font-size:12px;line-height:1.5}
.notif{position:fixed;top:15px;right:15px;padding:13px 18px;border-radius:11px;color:#fff;font-weight:600;font-size:13px;z-index:999;max-width:300px;box-shadow:0 8px 25px rgba(0,0,0,.3);animation:sd .3s}
.notif.ok{background:#10b981}.notif.warn{background:#f59e0b}.notif.err{background:#ef4444}
@keyframes sd{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.hide{display:none!important}
.err-msg{padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.top-bar button{width:auto;padding:7px 11px;font-size:13px;margin:0}
.btn-export{background:#10b981;margin-bottom:9px}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.filter-row select,.filter-row input{margin:0;font-size:12px;padding:8px 10px}
</style>
</head>
  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log('PWA aktif'))
    .catch(e => console.log('PWA gagal', e));
}
  </script>
<body>
<div class="box" id="authBox">
  <h1>💰 Keuangan Pro Max <span>Sinkron semua device 🔄</span></h1>
  <div class="tab-row">
    <button class="tab-btn on" onclick="showAuth('login',this)">🔑 Login</button>
    <button class="tab-btn" onclick="showAuth('reg',this)">✨ Daftar</button>
  </div>
  <div id="formLogin">
    <input type="email" id="lEmail" placeholder="📧 Email">
    <input type="password" id="lPass" placeholder="🔒 Password">
    <button onclick="doLogin()">🔑 Login</button>
  </div>
  <div id="formReg" class="hide">
    <input type="email" id="rEmail" placeholder="📧 Email">
    <input type="password" id="rPass" placeholder="🔒 Password (min 6)">
    <input type="password" id="rPass2" placeholder="🔒 Konfirmasi Password">
    <button onclick="doRegister()">✨ Daftar Sekarang</button>
  </div>
  <div id="authMsg"></div>
</div>

<div class="box hide" id="mainBox">
  <div class="top-bar">
    <div>
      <b>💰 Keuangan Pro Max</b>
      <div style="font-size:11px;color:#888" id="userInfo"></div>
    </div>
    <div>
      <button onclick="toggleDark()" id="darkBtn">🌙</button>
      <button onclick="doLogout()">🚪</button>
    </div>
  </div>
  
  <div class="tab-row">
    <button class="tab-btn on" onclick="showTab('dash',this)">📊</button>
    <button class="tab-btn" onclick="showTab('budget',this)">🎯</button>
    <button class="tab-btn" onclick="showTab('goal',this)">🏆</button>
    <button class="tab-btn" onclick="showTab('insight',this)">🤖</button>
  </div>
  
  <div id="tabDash">
    <div class="card">
      <div style="font-size:12px;opacity:.9">Saldo</div>
      <h2 id="balance">Rp 0</h2>
    </div>
    <div class="grid2">
      <div class="sum in">📈 Pemasukan<h3 id="totIn">Rp 0</h3></div>
      <div class="sum ex">📉 Pengeluaran<h3 id="totEx">Rp 0</h3></div>
    </div>
    
    <div class="chart-box">
      <div class="chart-title">📊 Pengeluaran per Kategori</div>
      <canvas id="chartPie"></canvas>
    </div>
    
    <div class="chart-box">
      <div class="chart-title">📈 Trend 6 Bulan</div>
      <canvas id="chartLine"></canvas>
    </div>
    
    <input type="text" id="fDesc" placeholder="Keterangan">
    <input type="number" id="fAmt" placeholder="Jumlah (Rp)">
    <select id="fType">
      <option value="income">📈 Pemasukan</option>
      <option value="expense">📉 Pengeluaran</option>
    </select>
    <select id="fCat">
      <option value="Gaji">💼 Gaji</option>
      <option value="Bonus">🎁 Bonus</option>
      <option value="Investasi">📊 Investasi</option>
      <option value="Makanan">🍔 Makanan</option>
      <option value="Transport">🚗 Transport</option>
      <option value="Belanja">🛍️ Belanja</option>
      <option value="Tagihan">📄 Tagihan</option>
      <option value="Hiburan">🎮 Hiburan</option>
      <option value="Kesehatan">💊 Kesehatan</option>
      <option value="Lainnya">📌 Lainnya</option>
    </select>
    <button onclick="addTrx()" id="addBtn">➕ Tambah Transaksi</button>
    
    <h3 style="font-size:15px;margin:15px 0 10px">📋 Riwayat</h3>
    <div class="filter-row">
      <select id="fFilterType" onchange="render()">
        <option value="all">Semua Jenis</option>
        <option value="income">📈 Pemasukan</option>
        <option value="expense">📉 Pengeluaran</option>
      </select>
      <input type="month" id="fFilterMonth" onchange="render()">
    </div>
    <button class="btn-export" onclick="exportCSV()">📤 Export CSV</button>
    <div id="list"></div>
  </div>
  
  <div id="tabBudget" class="hide">
    <h3 style="font-size:15px;margin-bottom:10px">🎯 Budget Bulanan</h3>
    <select id="bCat">
      <option value="Makanan">🍔 Makanan</option>
      <option value="Transport">🚗 Transport</option>
      <option value="Belanja">🛍️ Belanja</option>
      <option value="Tagihan">📄 Tagihan</option>
      <option value="Hiburan">🎮 Hiburan</option>
      <option value="Kesehatan">💊 Kesehatan</option>
      <option value="Lainnya">📌 Lainnya</option>
    </select>
    <input type="number" id="bAmt" placeholder="Batas budget (Rp)">
    <button onclick="saveBudget()">💾 Set Budget</button>
    <div id="bList" style="margin-top:15px"></div>
  </div>
  
  <div id="tabGoal" class="hide">
    <h3 style="font-size:15px;margin-bottom:10px">🏆 Target Tabungan</h3>
    <input type="text" id="gName" placeholder="Nama target">
    <input type="number" id="gAmt" placeholder="Target (Rp)">
    <button onclick="addGoal()">🎯 Tambah Target</button>
    <div id="gList" style="margin-top:15px"></div>
  </div>
  
  <div id="tabInsight" class="hide">
    <h3 style="font-size:15px;margin-bottom:10px">🤖 AI Insight</h3>
    <div id="insightBox"></div>
  </div>
</div>

<script>
const SB_URL='https://bqoqvuuaenzgdemyuvwi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxb3F2dXVhZW56Z2RlbXl1dndpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzY4ODEsImV4cCI6MjEwNzU1Mjg4MX0.qxZUP5KCmGZ_XSe0bc8ai4UorQIQkwJWSS1FhYTFnAE';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null,trx=[],budgets={},goals=[],ch=null,pieChart=null,lineChart=null;

const cats={'Gaji':'💼','Bonus':'🎁','Investasi':'📊','Makanan':'🍔','Transport':'🚗','Belanja':'🛍️','Tagihan':'📄','Hiburan':'🎮','Kesehatan':'💊','Lainnya':'📌'};
const colors={'Gaji':'#10b981','Bonus':'#f59e0b','Investasi':'#3b82f6','Makanan':'#ef4444','Transport':'#8b5cf6','Belanja':'#ec4899','Tagihan':'#f97316','Hiburan':'#06b6d4','Kesehatan':'#14b8a6','Lainnya':'#6b7280'};

const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML;};

function notif(m,t='ok'){const n=document.createElement('div');n.className='notif '+t;n.textContent=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3500);}
function showAuth(m,b){document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('formLogin').classList.toggle('hide',m!=='login');document.getElementById('formReg').classList.toggle('hide',m!=='reg');document.getElementById('authMsg').innerHTML='';}
function authMsg(m,isErr){document.getElementById('authMsg').innerHTML='<div class="err-msg" style="background:'+(isErr?'#ffebee':'#e8f5e9')+';color:'+(isErr?'#c62828':'#2e7d32')+'">'+m+'</div>';}

async function doLogin(){
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  if(!email||!pass){authMsg('⚠️ Isi email & password!',1);return;}
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){authMsg('❌ '+error.message,1);return;}
  user=data.user;startApp();
}

async function doRegister(){
  const email=document.getElementById('rEmail').value.trim();
  const p1=document.getElementById('rPass').value;
  const p2=document.getElementById('rPass2').value;
  if(!email||!p1){authMsg('⚠️ Isi semua!',1);return;}
  if(p1.length<6){authMsg('⚠️ Password min 6 karakter!',1);return;}
  if(p1!==p2){authMsg('⚠️ Password tidak sama!',1);return;}
  const{data,error}=await sb.auth.signUp({email,password:p1});
  if(error){authMsg('❌ '+error.message,1);return;}
  if(data.user&&!data.session){authMsg('✅ Cek email untuk verifikasi!',0);return;}
  user=data.user;startApp();
}

async function doLogout(){if(!confirm('Logout?'))return;if(ch)sb.removeChannel(ch);await sb.auth.signOut();location.reload();}

async function startApp(){
  document.getElementById('authBox').classList.add('hide');
  document.getElementById('mainBox').classList.remove('hide');
  document.getElementById('userInfo').textContent=user.email;
  await loadData();setupRT();render();
}

async function loadData(){
  const[t,b,g]=await Promise.all([
    sb.from('transactions').select('*').order('created_at',{ascending:false}),
    sb.from('budgets').select('*'),
    sb.from('goals').select('*').order('created_at',{ascending:false})
  ]);
  if(t.error)notif('Gagal load','err');
  trx=(t.data||[]).map(x=>({id:x.id,desc:x.description,amount:+x.amount,type:x.type,category:x.category,
    date:new Date(x.created_at).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}),
    month:x.created_at.slice(0,7)}));
  budgets={};(b.data||[]).forEach(x=>budgets[x.category]=+x.amount);
  goals=(g.data||[]).map(x=>({id:x.id,name:x.name,target:+x.target,saved:+x.saved}));
}

function setupRT(){
  ch=sb.channel('rt')
   .on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:'user_id=eq.'+user.id},async()=>{await loadData();render();})
   .on('postgres_changes',{event:'*',schema:'public',table:'budgets',filter:'user_id=eq.'+user.id},async()=>{await loadData();render();})
   .on('postgres_changes',{event:'*',schema:'public',table:'goals',filter:'user_id=eq.'+user.id},async()=>{await loadData();render();})
   .subscribe();
}

async function addTrx(){
  const desc=document.getElementById('fDesc').value.trim();
  const amt=parseFloat(document.getElementById('fAmt').value);
  const type=document.getElementById('fType').value;
  const cat=document.getElementById('fCat').value;
  if(!desc||!amt||amt<=0){notif('⚠️ Isi lengkap!','warn');return;}
  document.getElementById('addBtn').disabled=true;
  const{error}=await sb.from('transactions').insert({user_id:user.id,description:desc,amount:amt,type,category:cat});
  document.getElementById('addBtn').disabled=false;
  if(error){notif('❌ '+error.message,'err');return;}
  document.getElementById('fDesc').value='';document.getElementById('fAmt').value='';
  await loadData();render();checkBudget(cat);
}

async function delTrx(id){
  if(!confirm('Hapus?'))return;
  await sb.from('transactions').delete().eq('id',id);
  await loadData();render();
}

function getFiltered(){
  const ft=document.getElementById('fFilterType').value;
  const fm=document.getElementById('fFilterMonth').value;
  return trx.filter(t=>{
    if(ft!=='all'&&t.type!==ft)return false;
    if(fm&&t.month!==fm)return false;
    return true;
  });
}

function render(){
  const filtered=getFiltered();
  let inc=0,exp=0;filtered.forEach(t=>t.type==='income'?inc+=t.amount:exp+=t.amount);
  document.getElementById('balance').textContent=rp(inc-exp);
  document.getElementById('totIn').textContent=rp(inc);
  document.getElementById('totEx').textContent=rp(exp);
  const L=document.getElementById('list');
  if(!filtered.length){L.innerHTML='<div class="empty">Belum ada transaksi 📝</div>';}
  else{L.innerHTML=filtered.slice(0,50).map(t=>'<div class="item '+(t.type==='income'?'inc':'exp')+'"><div style="flex:1;min-width:0"><h4>'+esc(t.desc)+'<span class="tag" style="background:'+colors[t.category]+'">'+cats[t.category]+'</span></h4><small>'+t.date+'</small></div><div style="text-align:right"><div class="amt">'+(t.type==='income'?'+':'-')+rp(t.amount)+'</div><button class="del" onclick="delTrx(\''+t.id+'\')">🗑️</button></div></div>').join('');}
  renderCharts();
  renderBudget();renderGoals();renderInsight();
}

function renderCharts(){
  const isDark=document.body.classList.contains('dark');
  const tc=isDark?'#e5e7eb':'#333';
  
  // Pie chart - pengeluaran per kategori
  const ec={};trx.filter(t=>t.type==='expense').forEach(t=>ec[t.category]=(ec[t.category]||0)+t.amount);
  const pl=Object.keys(ec),pd=Object.values(ec),pc=pl.map(l=>colors[l]);
  if(pieChart)pieChart.destroy();
  const pctx=document.getElementById('chartPie').getContext('2d');
  if(!pl.length){
    pieChart=new Chart(pctx,{type:'doughnut',data:{labels:['Belum ada data'],datasets:[{data:[1],backgroundColor:['#e5e7eb']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:10}}}}}});
  } else {
    pieChart=new Chart(pctx,{type:'doughnut',data:{labels:pl,datasets:[{data:pd,backgroundColor:pc,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:{size:10}}}}}});
  }
  
  // Line chart - trend 6 bulan
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.toISOString().slice(0,7),l:d.toLocaleDateString('id-ID',{month:'short',year:'2-digit'})});}
  const incD=months.map(m=>trx.filter(t=>t.month===m.k&&t.type==='income').reduce((a,t)=>a+t.amount,0));
  const expD=months.map(m=>trx.filter(t=>t.month===m.k&&t.type==='expense').reduce((a,t)=>a+t.amount,0));
  if(lineChart)lineChart.destroy();
  const lctx=document.getElementById('chartLine').getContext('2d');
  lineChart=new Chart(lctx,{type:'line',data:{labels:months.map(m=>m.l),datasets:[
    {label:'📈 Masuk',data:incD,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.1)',tension:.4,fill:true,borderWidth:2,pointRadius:3},
    {label:'📉 Keluar',data:expD,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.1)',tension:.4,fill:true,borderWidth:2,pointRadius:3}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:10}}}},scales:{y:{ticks:{color:tc,font:{size:9},callback:v=>'Rp '+(v/1000)+'k'},grid:{color:isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)'}},x:{ticks:{color:tc,font:{size:9}},grid:{display:false}}}}});
}

function renderBudget(){
  const L=document.getElementById('bList');
  const cm=new Date().toISOString().slice(0,7);
  const ks=Object.keys(budgets);
  if(!ks.length){L.innerHTML='<div class="empty">Belum ada budget 🎯</div>';return;}
  L.innerHTML=ks.map(c=>{
    const b=budgets[c];
    const s=trx.filter(t=>t.category===c&&t.type==='expense'&&t.month===cm).reduce((a,t)=>a+t.amount,0);
    const p=Math.min(s/b*100,100);
    const cls=p>=100?'danger':p>=80?'warn':'ok';
    return '<div class="budget-item"><div class="row"><span>'+cats[c]+' '+c+'</span><span><b>'+rp(s)+'</b> / '+rp(b)+' <button class="del" onclick="delBudget(\''+c+'\')">🗑️</button></span></div><div class="bar"><div class="fill '+cls+'" style="width:'+p+'%"></div></div><div style="font-size:11px;color:#888;margin-top:5px">'+p.toFixed(0)+'% terpakai'+(p>=100?' ⚠️ OVER!':'')+'</div></div>';
  }).join('');
}

async function saveBudget(){
  const c=document.getElementById('bCat').value;
  const a=parseFloat(document.getElementById('bAmt').value);
  if(!a||a<=0){notif('⚠️ Isi jumlah!','warn');return;}
  const{error}=await sb.from('budgets').upsert({user_id:user.id,category:c,amount:a},{onConflict:'user_id,category'});
  if(error){notif('❌ Gagal','err');return;}
  document.getElementById('bAmt').value='';
  await loadData();renderBudget();notif('✅ Budget '+c+' disimpan');
}

async function delBudget(c){if(!confirm('Hapus budget '+c+'?'))return;await sb.from('budgets').delete().eq('category',c).eq('user_id',user.id);await loadData();renderBudget();}

function checkBudget(c){
  if(!budgets[c])return;
  const cm=new Date().toISOString().slice(0,7);
  const s=trx.filter(t=>t.category===c&&t.type==='expense'&&t.month===cm).reduce((a,t)=>a+t.amount,0);
  const p=s/budgets[c]*100;
  if(p>=100)notif('🚨 OVER BUDGET '+c+'!','err');
  else if(p>=80)notif('⚠️ '+c+' '+p.toFixed(0)+'% dari budget','warn');
}

async function addGoal(){
  const n=document.getElementById('gName').value.trim();
  const t=parseFloat(document.getElementById('gAmt').value);
  if(!n||!t||t<=0){notif('⚠️ Isi lengkap!','warn');return;}
  const{error}=await sb.from('goals').insert({user_id:user.id,name:n,target:t,saved:0});
  if(error){notif('❌ Gagal','err');return;}
  document.getElementById('gName').value='';document.getElementById('gAmt').value='';
  await loadData();renderGoals();notif('🎯 Target ditambahkan!');
}

async function delGoal(id){if(!confirm('Hapus?'))return;await sb.from('goals').delete().eq('id',id);await loadData();renderGoals();}

async function addToGoal(id){
  const a=parseFloat(prompt('Mau nabung berapa? (Rp)'));
  if(!a||a<=0)return;
  const g=goals.find(x=>x.id===id);if(!g)return;
  const ns=g.saved+a;
  await sb.from('goals').update({saved:ns}).eq('id',id);
  await loadData();renderGoals();
  if(ns>=g.target)notif('🎉 Target "'+g.name+'" tercapai!');
  else notif('💰 '+rp(a)+' ditambahkan');
}

function renderGoals(){
  const L=document.getElementById('gList');
  if(!goals.length){L.innerHTML='<div class="empty">Belum ada target 🏆</div>';return;}
  L.innerHTML=goals.map(g=>{
    const p=Math.min(g.saved/g.target*100,100);
    const cls=p>=100?'ok':'warn';
    const sisa=Math.max(g.target-g.saved,0);
    return '<div class="goal-item"><div class="row"><b>🏆 '+esc(g.name)+'</b><button class="del" onclick="delGoal(\''+g.id+'\')">🗑️</button></div><div style="font-size:12px;color:#888;margin-bottom:8px">'+rp(g.saved)+' / '+rp(g.target)+(sisa>0?' • Sisa '+rp(sisa):' • ✅ TERCAPAI!')+'</div><div class="bar"><div class="fill '+cls+'" style="width:'+p+'%"></div></div><div class="row" style="margin-top:9px"><span style="font-size:11px;color:#888">'+p.toFixed(0)+'%</span><button class="del" style="background:#667eea;padding:6px 10px" onclick="addToGoal(\''+g.id+'\')">💰 Nabung</button></div></div>';
  }).join('');
}

function renderInsight(){
  const el=document.getElementById('insightBox');
  const cm=new Date().toISOString().slice(0,7);
  const mt=trx.filter(t=>t.month===cm);
  const inc=mt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const exp=mt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  if(!trx.length){el.innerHTML='<div class="insight" style="background:#667eea"><h4>👋 Selamat Datang!</h4><p>Mulai catat transaksi untuk dapat insight keuangan personal!</p></div>';return;}
  const out=[];
  if(inc>0){
    const r=(inc-exp)/inc*100;
    if(r>=30)out.push({i:'🌟',t:'Savings Rate Hebat!',d:'Menabung '+r.toFixed(0)+'% bulan ini!',c:'#10b981'});
    else if(r>=10)out.push({i:'💡',t:'Savings Rate Cukup',d:r.toFixed(0)+'% bulan ini. Ideal 20-30%.',c:'#f59e0b'});
    else if(r>=0)out.push({i:'⚠️',t:'Savings Rate Rendah',d:'Hanya '+r.toFixed(0)+'%. Ayo hemat!',c:'#ef4444'});
    else out.push({i:'🚨',t:'Defisit!',d:'Lebih keluar '+rp(Math.abs(inc-exp)),c:'#ef4444'});
  }
  const ec={};mt.filter(t=>t.type==='expense').forEach(t=>ec[t.category]=(ec[t.category]||0)+t.amount);
  const sorted=Object.entries(ec).sort((a,b)=>b[1]-a[1]);
  if(sorted.length){const[cat,amt]=sorted[0];const p=exp>0?(amt/exp*100).toFixed(0):0;out.push({i:cats[cat],t:'Pengeluaran Terbesar',d:'"'+cat+'": '+rp(amt)+' ('+p+'%)',c:colors[cat]});}
  const dim=new Date().getDate();
  if(exp>0)out.push({i:'📊',t:'Rata-rata Harian',d:rp(exp/dim)+'/hari. Estimasi bulan: '+rp(exp/dim*30),c:'#667eea'});
  const lastM=new Date();lastM.setMonth(lastM.getMonth()-1);
  const lastK=lastM.toISOString().slice(0,7);
  const lastE=trx.filter(t=>t.month===lastK&&t.type==='expense').reduce((a,t)=>a+t.amount,0);
  if(lastE>0&&exp>0){
    const df=(exp-lastE)/lastE*100;
    if(df>10)out.push({i:'📈',t:'Pengeluaran Naik',d:'Naik '+df.toFixed(0)+'% dari bulan lalu.',c:'#ef4444'});
    else if(df<-10)out.push({i:'📉',t:'Pengeluaran Turun',d:'Mantap! Turun '+Math.abs(df).toFixed(0)+'%.',c:'#10b981'});
  }
  const tips=['💡 Aturan 50/30/20: 50% kebutuhan, 30% keinginan, 20% tabungan.','💡 Catat pengeluaran kecil, sering bikin bocor.','💡 Dana darurat 3-6x pengeluaran bulanan.','💡 Review langganan bulanan.','💡 Belanja pakai list.','💡 Investasi rutin walau kecil.'];
  out.push({i:'💡',t:'Tips Hari Ini',d:tips[new Date().getDate()%tips.length],c:'#667eea'});
  el.innerHTML=out.map(x=>'<div class="insight" style="background:'+x.c+'"><h4>'+x.i+' '+x.t+'</h4><p>'+x.d+'</p></div>').join('');
}

function exportCSV(){
  const filtered=getFiltered();
  if(!filtered.length){notif('Tidak ada data!','warn');return;}
  let csv='Tanggal,Keterangan,Kategori,Jenis,Jumlah\n';
  filtered.forEach(t=>{csv+='"'+t.date+'","'+t.desc+'","'+t.category+'","'+(t.type==='income'?'Pemasukan':'Pengeluaran')+'",'+t.amount+'\n';});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='keuangan_'+new Date().toISOString().slice(0,10)+'.csv';
  link.click();
  notif('📤 Berhasil di-export!','ok');
}

function showTab(t,b){
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['tabDash','tabBudget','tabGoal','tabInsight'].forEach(id=>document.getElementById(id).classList.add('hide'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hide');
  if(t==='dash')setTimeout(renderCharts,50);
  if(t==='insight')renderInsight();
}

function toggleDark(){
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  document.getElementById('darkBtn').textContent=d?'☀️':'🌙';
  localStorage.setItem('dark',d);
  setTimeout(renderCharts,50);
}

async function init(){
  if(localStorage.getItem('dark')==='true'){document.body.classList.add('dark');document.getElementById('darkBtn').textContent='☀️';}
  const{data:{session}}=await sb.auth.getSession();
  if(session){user=session.user;startApp();}
}
init();

document.getElementById('lPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('rPass2').addEventListener('keypress',e=>{if(e.key==='Enter')doRegister();});
document.getElementById('fAmt').addEventListener('keypress',e=>{if(e.key==='Enter')addTrx();});
</script>
